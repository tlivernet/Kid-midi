<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Kid MIDI</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #777; overflow: hidden;
    font-family: system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  #start { position: fixed; inset: 0; width: 100%; border: 0; background: #000; color: #ddd;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; font-size: 2rem; }
  #start small { font-size: 1rem; color: #777; }
  #dot { position: fixed; right: 14px; bottom: 14px; width: 8px; height: 8px; border-radius: 50%; background: #300; }
  #dot.ok { background: #032; }
  #info { position: fixed; left: 16px; right: 16px; bottom: 16px; display: none;
    font: 14px/1.5 monospace; color: #999; white-space: pre-wrap; }
  #info button { margin: .5rem .5rem 0 0; font: inherit; background: #222; color: #ccc; border: 1px solid #444; padding: .5rem .9rem; }
  #err { position: fixed; left: 16px; right: 40px; bottom: 10px; font: 12px monospace; color: #a33; }
  #learnbox { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    font-size: 1.6rem; line-height: 1.6; color: #ccc; background: #000; padding: 16px; white-space: pre-wrap; }
</style>
</head>
<body>
<button id="start">▶ Toucher pour démarrer<small>Kid MIDI — branche le MiniLab puis touche l'écran</small></button>
<div id="dot"></div>
<div id="info"><span id="infotext"></span><br><button id="learn">Apprendre les potards</button><button id="magic">Gamme magique</button><button id="test">Test son</button><button id="latency">Latence</button><button id="close">Fermer</button></div>
<div id="learnbox"></div>
<div id="err"></div>
<script src="sounds/bank.js"></script>
<script src="js/themes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
